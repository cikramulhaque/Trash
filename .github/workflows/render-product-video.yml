name: Render product video
on:
  workflow_dispatch:
    inputs:
      product_title:
        description: Product title
        required: true
        default: realme Buds Air 8 - Master Grey
        type: string
      subtitle:
        description: Closing line
        required: true
        default: Premium sound. Refined design.
        type: string
      image_urls:
        description: JSON array of 2-5 fresh genuine product image HTTPS URLs
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r renderer/requirements.txt
      - name: Render and verify
        env:
          PRODUCT_TITLE: ${{ inputs.product_title }}
          SUBTITLE: ${{ inputs.subtitle }}
          IMAGE_URLS: ${{ inputs.image_urls }}
        run: |
          mkdir -p output
          python renderer/render.py --title "$PRODUCT_TITLE" --subtitle "$SUBTITLE" --images "$IMAGE_URLS" --output output/product-video.mp4
      - name: Ensure no image files remain
        run: |
          if find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.avif' \) -print -quit | grep -q .; then echo "Image cleanup failed"; exit 1; fi
          test -s output/product-video.mp4
          test -s output/build-report.txt
      - name: Upload MP4 and text report
        uses: actions/upload-artifact@v4
        with:
          name: product-video-output
          path: |
            output/product-video.mp4
            output/build-report.txt
          if-no-files-found: error
          retention-days: 3
